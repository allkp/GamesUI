name: Frontend CI and image publish


on:
  push:
    branches: [main]
    paths:
      - "Tic-Tac-Teo/**"
      - "./github/workflows/frontend-ci.yml"
  pull_requests:
    branches: [main]
    paths:
      - "Tic-Tac-Teo/**"
      - "./github/workflows/frontend-ci.yml"


permissions:
  contents: read


jobs:
  build-and-test:
    name: Lint and build frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Tic-Tac-Teo

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Tic-Tac-Teo/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check code style
        run: npm run lint

      - name: Build React app
        run: npm run build

  build-scan-publish:
    name: Build, scan, and publish frontend image
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image locally
        uses: docker/build-push-action@v6
        with:
          context: ./Tic-Tac-Teo
          load: true
          tags: ghcr.io/allkp/tic-tac-teo-frontend:sha-${{ github.sha }}
          build-args: |
            VITE_API_BASE=/api/games
            VITE_WS_BASE=/ws

      - name: scan image with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ghcr.io/allkp/tic-tac-teo-frontend:sha-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image as latest
        run: docker tag ghcr.io/allkp/tic-tac-teo-frontend:sha=${GITHUB_SHA} ghcr.io/allkp/tic-tac-teo-frontend:latest

      - name: Push scanned image to GHCR
        run: |
          docker push ghcr.io/allkp/tic-tac-teo-frontend:sha-${GITHUB_SHA}
          docker push ghcr.io/allkp/tic-tac-teo-frontend:latest

